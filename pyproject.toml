[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "climeproof"
version = "0.1.0"
description = "Deterministic pipeline: U.S. address or coordinates -> documented, provenance-tagged hazard-exposure record."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "requests>=2.32",
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.optional-dependencies]
# Gridded / cloud-native sources (Open Climate Risk wildfire tensors). Heavy, so optional.
wildfire = [
    "icechunk>=1.0",
    "xarray>=2024.10",
    "zarr>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
climeproof = "climeproof.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/climeproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real public APIs (deselected by default; run with `pytest -m live`)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/climeproof/catalog.py" = ["E501"]  # one metric per line reads better than wrapped
"tests/*" = ["E501"]
