# ClimeProof pipeline configuration. Change a value -> bump `pipeline.config_version`.

[pipeline]
config_version = "2026.10-b"
cache_dir = "data/cache"
user_agent = "climeproof-pipeline/0.1"
workers = 4                       # parallel locations for HTTP-backed sources
http_timeout_s = 120

[periods]
# Metrics describe the RECENT climate: the most recent `recent_years` complete calendar
# years, ending last year (run in Oct 2026 -> 2011-2025). The window rolls forward each
# January. 15 years matches NOAA's 15-year "supplemental normals" convention and is long
# enough for stable averages of rarer days (>= 105F), short enough to reflect today's climate.
recent_years = 15
# Trends need a longer record to separate signal from year-to-year noise.
trend_years = 30
# 0 = auto (last complete calendar year). Set e.g. 2025 only to re-create an earlier run.
end_year = 0
# Minimum fraction of years with valid data for a multi-year statistic to be reported.
min_year_coverage = 0.9
# Record highs/lows use each station's full period of record, through yesterday.

# Fixed thresholds (100F, 105F, 28F, ...) are part of each metric's definition and live in
# catalog.py / the providers, not here: changing one is a schema change, not a config change.

[heatwave]
# PROVISIONAL definition pending data/science sign-off: an event is >= N consecutive days
# with Tmax at or above the location's own percentile of daily Tmax over the recent window.
min_consecutive_days = 3
tmax_percentile = 95

[geocoder]
# U.S. Census Geocoder. The benchmark is recorded in provenance for every location.
benchmark = "Public_AR_Current"
vintage = "Current_Current"
batch_size = 9000                 # API limit is 10,000 rows per request

[acis]
base_url = "https://data.rcc-acis.org"
grid = "21"                       # 21 = PRISM (served through ACIS GridData)
station_search_km = 60
max_station_distance_km = 50
min_record_years = 30             # record highs/lows: station must have >= this many years
# Station snow totals: a year counts if it has at most this many missing days.
max_missing_days_per_year = 15

[normals]
# NOAA 1991-2020 Normals: used only as a long-term REFERENCE in `climeproof compare`
# (the next edition, 2001-2030, is due ~2031). Not a source for record fields.
dataset = "normals-annualseasonal-1991-2020"
search_url = "https://www.ncei.noaa.gov/access/services/search/v1/data"
data_url = "https://www.ncei.noaa.gov/access/services/data/v1"
station_search_km = 60
max_station_distance_km = 50

[daymet]
url = "https://daymet.ornl.gov/single-pixel/api/data"

[open_climate_risk]
bucket = "us-west-2.opendata.source.coop"
prefix = "carbonplan/carbonplan-ocr/output/fire-risk/tensor/production/v1.1.0/ocr.icechunk"
region = "us-west-2"
version = "v1.1.0"
# Pin the Icechunk snapshot so the same input always reads the same bytes.
# Leave empty to read the current tip of `main` (the snapshot used is still recorded).
snapshot_id = "CZP0B0ETPG38MW0C1R30"
